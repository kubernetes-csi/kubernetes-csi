# GitHub Action to automate the identification of common misspellings in text files.
# https://github.com/codespell-project/actions-codespell
# https://github.com/codespell-project/codespell
name: codespell
on:
  push:
    branches: [main]
  pull_request:
jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          check_filenames: true
          # ./vendor, ./cmd, ./pkg are generated by sync.sh; ./staging covers
          # legacy local output. *.sum/*.log cover generated metadata and logs.
          skip: ./.git,./.github/workflows/codespell.yml,*.png,*.jpg,*.svg,*.sum,*.log,./vendor,./release-tools,./staging,./cmd,./pkg
