name: presubmit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Run the full kind-based hostpath e2e suite on every pull request, with a
  # weekly run (Mondays 06:00 UTC) for regressions outside PR changes.
  schedule:
    - cron: "0 6 * * 1"
jobs:
  # verify runs the code-quality gates that upstream kubernetes-csi expects
  # (gofmt, boilerplate license headers, shellcheck). These are scoped
  # to the hand-maintained source of truth under tools/ and to the shell
  # scripts we own. This lint job does not cover the generated assembly area
  # (cmd/, pkg/). Upstream CI does not validate our transformations
  # or unified dependencies; those need assembled-tree tests, not just lint.
  verify:
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - name: preload locked Linux builder
      run: docker pull "$(python3 -B tools/scripts/build_environment.py image)"
    - name: tooling tests, gofmt, and license headers in locked builder
      run: python3 -B tools/scripts/isolated_sync.py --engine docker --tooling-only
    # shellcheck: lint the shell scripts we own (sync/cleanup + CI entrypoints).
    # --severity=warning keeps the gate on real bugs/warnings while allowing
    # info-level style suggestions (e.g. SC2086 quoting) that would otherwise
    # add noise to the tightly-tuned sync.sh. shellcheck is preinstalled on
    # ubuntu-latest runners.
    - name: shellcheck
      run: shellcheck --severity=warning tools/scripts/*.sh .prow.sh .cloudbuild.sh

  build:
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - name: Read locked Go version
      id: go
      run: echo "version=$(python3 -B tools/scripts/ci.py go-version)" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.go.outputs.version }}
        cache: false
    - name: test assembled code and entrypoints
      run: make test-go test-vet test-fmt verify-entrypoints

  e2e-hostpath:
    # PRs must pass the full hostpath suite before merge. Preserve scheduled
    # and manual runs without adding a duplicate run for pushes to main.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    env:
      ARTIFACTS: ${{ github.workspace }}/artifacts/e2e
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
      with:
        fetch-depth: 0
    - name: Read locked Go version
      id: go
      run: echo "version=$(python3 -B tools/scripts/ci.py go-version)" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.go.outputs.version }}
        cache: false
    - run: |
        echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
    - run: go version
    - name: run hostpath Prow suite
      run: |
        set -o pipefail
        ./.prow.sh 2>&1 | tee .prow.sh.log
    - run: grep "Ginkgo ran" -B 4 .prow.sh.log
    - name: upload e2e reports and source lock
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: hostpath-e2e-${{ github.sha }}
        path: |
          .prow.sh.log
          artifacts/e2e/
          tools/assembly/sources.lock.json
        include-hidden-files: true
